<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 2 Vocabulary: Write the Word</title>
<style>
:root{--ink:#2b2216;--c1:#4e9a3f;--c2:#d9efc9;--ok:#1fa85a;--bad:#e0453a}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(170deg,#e8f6d8 0%,#fff3cf 100%);min-height:100vh}
.wrap{max-width:800px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-size:1.2rem;font-weight:900;background:var(--c1);color:#fff;border-radius:40px;padding:8px 20px;border:4px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.stats{display:flex;gap:8px;align-items:center}
.pill{background:#fff;border:3px solid var(--c2);border-radius:30px;padding:6px 14px;font-weight:800}
button{font-family:inherit;cursor:pointer}
.mute{border:3px solid var(--c2);background:#fff;border-radius:50%;width:44px;height:44px;font-size:1.3rem}
.bar{height:14px;background:#fff;border-radius:10px;margin:12px 0;overflow:hidden;border:2px solid var(--c2)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c1),#ffc83d);transition:width .5s}
.card{background:#fffdf7;border:4px solid var(--c1);border-radius:26px;padding:20px;margin:12px 0;box-shadow:0 6px 0 rgba(43,34,22,.13)}
h1,h2{margin:.2em 0}
.tag{display:inline-block;background:var(--c2);border-radius:12px;padding:4px 12px;font-weight:800}
.tc{text-align:center}
.pic{display:block;margin:10px auto;max-width:100%;max-height:230px;border-radius:16px;border:3px solid var(--c2);background:#fff}
.q{font-size:1.3rem;font-weight:800;text-align:center;margin:8px 0}
.slot{margin:10px auto;max-width:300px;height:56px;border:4px solid var(--c1);border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900}
.bank{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:10px}
.w{background:#fff;border:3px solid var(--c2);border-radius:14px;padding:10px 6px;font-size:1.05rem;font-weight:800;color:var(--ink)}
.w:hover:not(:disabled){transform:translateY(-2px);border-color:var(--c1)}
.w.wrong{background:#ffd5d0;border-color:var(--bad);text-decoration:line-through}
.w.right{background:#c9f3d8;border-color:var(--ok)}
.w.used{opacity:.35;text-decoration:line-through;background:#eee}
.btn{background:var(--c1);color:#fff;border:0;border-bottom:5px solid rgba(0,0,0,.28);border-radius:16px;padding:12px 26px;font-size:1.15rem;font-weight:900;margin:10px 6px 0 0}
.btn.o{background:#ffc83d;color:var(--ink)}
.btn:active{transform:translateY(3px)}
input[type=text]{width:100%;font:inherit;font-size:1.5rem;text-align:center;padding:10px;border:4px solid var(--c2);border-radius:16px;color:var(--ink);background:#fff}
input:focus,button:focus-visible{outline:4px solid #ffc83d}
.fb{min-height:30px;text-align:center;font-weight:900;font-size:1.1rem;margin-top:10px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pp .5s}
@keyframes pp{50%{transform:scale(1.04)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.lc{background:#fff;border:3px solid var(--c2);border-radius:16px;padding:6px;font-weight:900;font-size:1.05rem;color:var(--ink)}
.lc img{width:100%;height:100px;object-fit:cover;border-radius:10px;display:block;margin-bottom:4px}
.lc:hover{border-color:var(--c1);transform:translateY(-2px)}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.po{padding:4px;background:#fff;border:4px solid var(--c2);border-radius:16px}
.po img{width:100%;height:130px;object-fit:cover;border-radius:10px;display:block}
.po.right{border-color:var(--ok);background:#c9f3d8}.po.wrong{border-color:var(--bad);opacity:.45}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tile{height:92px;border-radius:14px;border:3px solid var(--c1);background:var(--c1);color:#fff;font-size:1.8rem;font-weight:900;padding:2px;overflow:hidden}
.tile.up{background:#fff;color:var(--ink);border-color:var(--c2);font-size:1rem}
.tile.up img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.tile.done{border-color:var(--ok);background:#c9f3d8}
.stars{font-size:3rem;text-align:center}
.rev{margin:6px 0;padding:6px 12px;border-radius:12px;background:#fff0ec;border-left:6px solid var(--bad);text-align:left;display:flex;align-items:center;gap:10px}
.rev img{height:46px;border-radius:8px}
.fall{position:fixed;top:-40px;font-size:2rem;pointer-events:none;animation:fl 2.8s linear forwards;z-index:9}
@keyframes fl{to{transform:translateY(110vh) rotate(360deg)}}
footer{text-align:center;font-weight:800;margin:18px 0 6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

const $=id=>document.getElementById(id);
function ac(){if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,d,type="sine",delay=0,vol=.2){if(muted)return;const c=ac();if(!c)return;const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d)}
const sfx={click:()=>tone(660,.08,"square",0,.08),ok:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.18,"triangle",i*.09,.22)),no:()=>{tone(200,.25,"sawtooth",0,.15);tone(150,.3,"sawtooth",.15,.15)},win:()=>[523,659,784,659,784,1046,1318].forEach((f,i)=>tone(f,.25,"triangle",i*.13,.25)),star:()=>tone(1200,.15,"sine",0,.15),pop:()=>tone(880,.1,"sine",0,.15)};
function speak(t){if(muted||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}
function confetti(n=24){const e=["🎉","⭐","🌟","✨","🐾"];for(let i=0;i<n;i++){const s=document.createElement("span");s.className="fall";s.textContent=e[i%e.length];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),3800)}}
$("mu").onclick=()=>{muted=!muted;$("mu").textContent=muted?"🔇":"🔊";if(muted&&window.speechSynthesis)speechSynthesis.cancel();else sfx.click()};
const shuf=a=>[...a].sort(()=>Math.random()-.5);
function hud(){$("sc").textContent=score;$("st").textContent=streak;$("pg").style.width=Math.max(0,idx)/Q.length*100+"%"}
function build(){
 if(MODE==="cards"){Q=shuf(WORDS).map(a=>({t:"pick",a}));Q.push({t:"mem"});MAXPTS=WORDS.length*10+60}
 else{Q=ORDER[MODE].map(a=>({t:MODE==="write"?"w":"l",a}));MAXPTS=Q.length*10}
}
function start(){
 $("app").innerHTML=`<div class="card tc pop"><div style="font-size:3rem">🦅🐱🐍🐪🦈🐧</div><h1>Write the Word</h1><p>Look at each picture and write the correct word. Use the word bank to help you!</p>
 <p><input type="text" id="nm" maxlength="20" placeholder="Type your name" aria-label="Your name" autocomplete="off"></p><button class="btn" onclick="go()">Start</button></div>`;hud()
}
function go(){ac();name=($("nm").value||"Explorer").trim();sfx.click();build();speak("Hello "+name+"! Let's learn the animal body parts.");learn()}
function say(w){sfx.click();speak(w)}
function learn(){
 idx=-1;hud();
 $("app").innerHTML=`<div class="card pop"><h2>Hello, ${name}! 👋</h2><p>Tap a card to hear the word. Learn them all, then play!</p>
 <div class="grid">${WORDS.map(w=>`<button class="lc" onclick="say('${w}')"><img src="${IMG[w]}" alt="${w}">${MODE==="letters"?LET[w]+". ":""}${w}</button>`).join("")}</div></div>
 <div class="tc"><button class="btn o" onclick="next()">I’m ready! 🚀</button></div>`
}
function next(){idx++;tries=0;locked=false;sfx.click();hud();if(idx>=Q.length)return end();render()}
function head(l){return `<span class="tag">${l}</span> <span style="float:right;font-weight:800">${idx+1} / ${Q.length}</span>`}
function nextBtn(){const n=$("nx");if(n)n.innerHTML=`<button class="btn o" onclick="next()">${idx===Q.length-1?"See my result 🏆":"Next ➜"}</button>`;if($("ck"))$("ck").style.display="none"}
function render(){
 const q=Q[idx];let h=`<div class="card pop">`;
 if(q.t==="w"){
  h+=`${head("Write the correct word")}<img class="pic" src="${IMG[q.a]}" alt="Animal body part picture">
  <p><input type="text" id="an" placeholder="Type the word" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Answer"></p>
  <div class="tc"><button class="btn" id="ck" onclick="checkW()">Check ✔</button></div>
  <p class="tc"><b>Word bank</b> (tap to fill)</p><div class="bank">${shuf(WORDS).map(w=>`<button class="w${used.includes(w)?" used":""}" onclick="fillW('${w}')">${w}</button>`).join("")}</div>`
 }else if(q.t==="l"){
  h+=`${head("Match the picture with the word")}<img class="pic" src="${IMG[q.a]}" alt="Animal body part picture"><div class="slot" id="slot">?</div>
  <div class="bank">${WORDS.slice().sort((a,b)=>LET[a]<LET[b]?-1:1).map(w=>`<button class="w${used.includes(w)?" used":""}" ${used.includes(w)?"disabled":""} onclick="pickL(this,'${w}')">${LET[w]}. ${w}</button>`).join("")}</div>`
 }else if(q.t==="pick"){
  const o=shuf([q.a,...shuf(WORDS.filter(x=>x!==q.a)).slice(0,3)]);
  h+=`${head("Listen and pick the picture")}<div class="q"><button class="w" style="padding:8px 14px" onclick="say('${q.a}')">🔊</button> Find: <b>${q.a}</b></div>
  <div class="ops">${o.map(w=>`<button class="po" onclick="pickP(this,'${w}')"><img src="${IMG[w]}" alt="Picture option"></button>`).join("")}</div>`
 }else{
  mem={tiles:shuf(WORDS).slice(0,6).flatMap(w=>[{k:w,i:1},{k:w,i:0}]).sort(()=>Math.random()-.5),open:[],done:0,moves:0};
  h+=`${head("Memory match")}<div class="q">Match each picture with its word.</div><div class="mem" id="mem"></div>`
 }
 h+=`<div class="fb" id="fb" aria-live="polite"></div><div class="tc" id="nx"></div></div>`;
 $("app").innerHTML=h;
 if(q.t==="w"){$("an").focus();$("an").addEventListener("keydown",e=>{if(e.key==="Enter")checkW()})}
 if(q.t==="pick")speak(q.a);
 if(q.t==="mem")drawMem()
}
function good(pts,msg,w){
 locked=true;score+=pts;streak++;best=Math.max(best,streak);res[idx]=1;hud();sfx.ok();
 const f=$("fb");f.className="fb ok";f.textContent=msg+" +"+pts;
 if(streak%3===0){setTimeout(()=>{sfx.star();confetti(14)},350);f.textContent+="  🔥 "+streak+" in a row!"}
 if(w)speak(w);nextBtn()
}
function shake(){streak=0;hud();sfx.no();const c=$("app").firstElementChild;c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake")}
function give(w){locked=true;res[idx]=0;miss.push(`<img src="${IMG[w]}" alt=""><span>${MODE==="letters"?LET[w]+". ":""}<b>${w}</b></span>`);used.push(w);hud();const f=$("fb");f.className="fb no";f.innerHTML=`The answer is: <b>${w}</b>`;setTimeout(()=>speak(w),600);nextBtn()}
function fillW(w){if(locked)return;sfx.click();$("an").value=w;$("an").focus()}
function checkW(){
 if(locked)return;const q=Q[idx],v=$("an").value.trim().toLowerCase();if(!v){$("an").focus();return}
 if(v===q.a){used.push(q.a);good(tries===0?10:5,tries===0?"Perfect! 🎉":"Good job! 👍",q.a);return}
 tries++;shake();
 if(tries>=2)return give(q.a);
 const f=$("fb");f.className="fb no";f.textContent=`Not yet. Hint: ${HINT[q.a]} It starts with “${q.a[0]}” and has ${q.a.length} letters.`;$("an").select()
}
function pickL(b,w){
 if(locked)return;const q=Q[idx];speak(w);
 if(w===q.a){b.classList.add("right");used.push(w);$("slot").textContent=LET[w];good(tries===0?10:5,tries===0?"Perfect! 🎉":"Good job! 👍");return}
 b.classList.add("wrong");b.disabled=true;tries++;shake();
 if(tries>=2){document.querySelectorAll(".bank .w").forEach(x=>{if(x.textContent.endsWith(q.a)){x.disabled=true;x.classList.add("right")}});$("slot").textContent=LET[q.a];give(q.a);return}
 const f=$("fb");f.className="fb no";f.textContent="Not yet. Hint: "+HINT[q.a]
}
function pickP(b,w){
 if(locked)return;const q=Q[idx];
 if(w===q.a){b.classList.add("right");good(tries===0?10:5,tries===0?"Perfect! 🎉":"Good job! 👍",w);return}
 b.classList.add("wrong");b.disabled=true;tries++;shake();speak(w);
 if(tries>=2){document.querySelectorAll(".po").forEach(x=>{if(x.querySelector("img").src===IMG[q.a])x.classList.add("right")});give(q.a);return}
 const f=$("fb");f.className="fb no";f.textContent="That is “"+w+"”. Try again!"
}
function drawMem(){
 $("mem").innerHTML=mem.tiles.map((t,i)=>{const up=t.d||mem.open.includes(i);return `<button class="tile ${up?"up":""} ${t.d?"done":""}" onclick="flip(${i})" aria-label="Memory tile">${up?(t.i?`<img src="${IMG[t.k]}" alt="">`:t.k):"?"}</button>`}).join("")
}
function flip(i){
 if(locked||mem.open.includes(i)||mem.tiles[i].d||mem.open.length>=2)return;
 sfx.pop();mem.open.push(i);if(!mem.tiles[i].i)speak(mem.tiles[i].k);drawMem();
 if(mem.open.length===2){
  mem.moves++;const[a,b]=mem.open.map(x=>mem.tiles[x]);
  setTimeout(()=>{
   if(a.k===b.k){a.d=b.d=1;mem.done++;score+=10;streak++;best=Math.max(best,streak);hud();sfx.ok();$("fb").className="fb ok";$("fb").textContent="A match! +10";
    if(mem.done===6){locked=true;res[idx]=1;sfx.star();confetti(20);$("fb").textContent=`All matched in ${mem.moves} moves! 🎉`;nextBtn()}}
   else{streak=0;hud();sfx.no();$("fb").className="fb no";$("fb").textContent="Not a match. Try again!"}
   mem.open=[];drawMem()
  },900)
 }
}
function end(){
 hud();$("pg").style.width="100%";const pc=Math.round(score/MAXPTS*100),st=pc>=85?3:pc>=60?2:pc>=30?1:0,right=res.filter(x=>x===1).length;
 const msg=["Keep practising. You can do it! 💪","Good start! Try again for more stars.","Great work! Almost perfect!","Amazing! You know all the body parts!"][st];
 sfx.win();confetti(40);speak("Well done "+name+"! Your score is "+score+" out of "+MAXPTS);
 $("app").innerHTML=`<div class="card tc pop"><h1>Well done, ${name}! 🏆</h1><div class="stars">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div>
 <h2>${score} / ${MAXPTS} points (${pc}%)</h2><p>Correct: <b>${right}</b> / ${Q.length} · Best streak: <b>🔥 ${best}</b></p><p>${msg}</p>
 ${miss.length?`<p><b>Review these words:</b></p>${miss.map(m=>`<div class="rev">${m}</div>`).join("")}`:""}
 <button class="btn o" onclick="again()">Play again 🔄</button><button class="btn" onclick="learn()">Review the words 📘</button></div>`
}
function again(){score=0;streak=0;best=0;idx=-1;res=[];miss=[];used=[];build();sfx.click();learn()}
start();
</script></body></html>
